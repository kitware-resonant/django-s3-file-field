<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200" role="img" aria-label="The browser sends small signed requests to Django, and the file bytes straight to S3 or MinIO">
  <style>
    text { font: 14px "Noto Sans", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .label { font-size: 13px; fill: #656d76; }
    .box { fill: none; stroke: #8c959f; stroke-width: 1.5; }
    .flow { fill: none; stroke: #656d76; stroke-linecap: round; }
    .signed { stroke-width: 1.5; stroke-dasharray: 4 4; }
    .bytes { stroke-width: 3; }
    .head { fill: #656d76; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .label, .box { stroke: #8b949e; fill: none; }
      .label { fill: #8b949e; }
      .flow { stroke: #8b949e; }
      .head { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <!-- Browser -->
  <rect class="box" x="10" y="78" width="100" height="44" rx="6"/>
  <text x="60" y="105" text-anchor="middle">Browser</text>

  <!-- Django -->
  <rect class="box" x="350" y="22" width="110" height="44" rx="6"/>
  <text x="405" y="49" text-anchor="middle">Django</text>

  <!-- S3 / MinIO (cylinder) -->
  <path class="box" d="M 350 134 a 55 9 0 0 1 110 0 v 44 a 55 9 0 0 1 -110 0 z"/>
  <path class="box" d="M 350 134 a 55 9 0 0 0 110 0"/>
  <text x="405" y="165" text-anchor="middle">S3 / MinIO</text>

  <!-- Small signed requests: Browser to Django -->
  <path class="flow signed" d="M 110 92 C 140 92 140 44 170 44 H 176"/>
  <text class="label" x="252" y="48" text-anchor="middle">small signed requests</text>
  <path class="flow signed" d="M 328 44 H 348" marker-end="url(#arrow)"/>

  <!-- File bytes: Browser to S3 -->
  <path class="flow bytes" d="M 110 108 C 140 108 140 156 170 156 H 214"/>
  <text class="label" x="252" y="160" text-anchor="middle">file bytes</text>
  <path class="flow bytes" d="M 290 156 H 346" marker-end="url(#arrow)"/>
</svg>
